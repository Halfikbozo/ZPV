<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wprowadzenie</title>
    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous"></script>
    <script>
        $(function(){
            $("#logowanie").on("submit", function(e){
                e.preventDefault();
                let logowanie = $("#login").val().trim();
                let haslo = $("#pass").val().trim();
                if(logowanie === ""){
                    $("#info").text("Podaj login")
                } else if (haslo.length < 6){
                    $("#info").text("Hasło za krótkie")
                } else {
                    $("#info").text("Witaj " + logowanie).css("color", "green")
                }
            })
        })
    </script>
    <style>

    </style>
</head>
<body>
    <form id="logowanie">
  <input type="text" id="login" placeholder="Login">
  <input type="password" id="pass" placeholder="Hasło">
  <button type="submit">Zaloguj</button>
</form>
<p id="info"></p>
</body>
</html>
